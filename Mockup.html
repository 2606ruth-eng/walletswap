<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>walletswap – buy, sell, and swap gift cards</title>
<meta name="theme-color" content="#12B76A">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20470%20470%22%3E%3Crect%20x%3D%2230%22%20y%3D%2230%22%20width%3D%22280%22%20height%3D%22280%22%20rx%3D%2270%22%20fill%3D%22%2312141A%22/%3E%3Crect%20x%3D%22160%22%20y%3D%22160%22%20width%3D%22280%22%20height%3D%22280%22%20rx%3D%2270%22%20fill%3D%22%2312B76A%22/%3E%3C/svg%3E">
<style>
:root{
  /* walletswap palette */
  --brand:#12B76A;            /* logo green: fills, accents */
  --brand-ink:#12141A;        /* logo ink */
  --brand-text:#087A45;       /* green for text on light surfaces (AA) */
  --brand-soft:#E3F6EC;
  --bg:#F4F5F7;--surface:#FFFFFF;--surface2:#FAFAFA;--ink:#12141A;--ink2:#2E313A;--muted:#6F7581;
  --line:#E7E8EC;--arc:#EFEFF0;--pos:var(--brand-text);--danger:#D6363C;--btn:#12141A;--btn-ink:#FFFFFF;--chip:#FFFFFF;
  --scrim:rgba(18,20,26,.45);--stage:#E9EAEE;--mark-ink:#12141A;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --brand-text:#12B76A;--brand-soft:rgba(18,183,106,.16);
    --bg:#0C0D11;--surface:#17181E;--surface2:#1E2027;--ink:#F4F5F7;--ink2:#D3D6DC;--muted:#9097A3;
    --line:#2A2C34;--arc:#1C1E25;--danger:#FF6268;--btn:#12B76A;--btn-ink:#12141A;--chip:#17181E;
    --scrim:rgba(0,0,0,.6);--stage:#050608;--mark-ink:#F4F5F7;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --brand-text:#12B76A;--brand-soft:rgba(18,183,106,.16);
  --bg:#0C0D11;--surface:#17181E;--surface2:#1E2027;--ink:#F4F5F7;--ink2:#D3D6DC;--muted:#9097A3;
  --line:#2A2C34;--arc:#1C1E25;--danger:#FF6268;--btn:#12B76A;--btn-ink:#12141A;--chip:#17181E;
  --scrim:rgba(0,0,0,.6);--stage:#050608;--mark-ink:#F4F5F7;color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",system-ui,sans-serif;
  font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#root{height:100%}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.i{flex:none;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)}
.pos{color:var(--pos)}
.neg{color:var(--ink)}
.num{font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 20px;border-radius:16px;
  font-weight:650;font-size:16px;white-space:nowrap;transition:transform .12s,opacity .12s,background .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--btn);color:var(--btn-ink)}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.block{width:100%}
.btn.sm{height:40px;border-radius:12px;font-size:14px;padding:0 14px}
.btn[disabled]{opacity:.38;pointer-events:none}
.link{color:var(--brand-text);font-weight:700;font-size:15px}

/* ---------- app frame ---------- */
.stage{height:100%;display:flex;justify-content:center}
.phone{position:relative;width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (min-width:700px) and (min-height:640px){
  .stage{background:var(--stage);align-items:center;padding:24px}
  .phone{height:min(900px,100%);border-radius:34px;border:1px solid var(--line);box-shadow:0 30px 80px -30px rgba(0,0,0,.35)}
}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:22px 20px 32px;scrollbar-width:thin}
.screen.anim{animation:fadein .22s ease-out}
@keyframes fadein{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;background:var(--surface);
  border-top:1px solid var(--line);padding:6px 4px 8px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);padding:4px 0}
.tab.on{color:var(--ink)}
.tab{position:relative}
.tab.on::before{content:"";position:absolute;top:-7px;width:22px;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
.fab{justify-self:center;width:58px;height:58px;border-radius:18px;background:var(--brand);color:var(--brand-ink);
  display:grid;place-items:center;margin-top:-6px;box-shadow:0 8px 20px -8px rgba(18,183,106,.7)}

/* ---------- headings ---------- */
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.top h1{font-size:30px;line-height:1.1;margin:0;font-weight:750;letter-spacing:-.02em;flex:1}
.back{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 12px}
.sec-h h2{font-size:21px;margin:0;font-weight:700;letter-spacing:-.01em}
.sec-h .meta{color:var(--muted);font-size:15px}
.group-label{font-size:13px;font-weight:650;color:var(--muted);margin:22px 4px 8px}
.sub{color:var(--muted);font-size:15px;margin:-8px 0 20px}

/* ---------- wallet ---------- */
.w-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.hello{font-size:19px;color:var(--muted);margin:0}
.lbl{display:flex;align-items:center;gap:6px;font-size:16px;color:var(--muted);margin:6px 0 0}
.lbl button{color:var(--muted);padding:4px;border-radius:8px}
.total{font-size:50px;font-weight:750;letter-spacing:-.03em;margin:4px 0 0;line-height:1.08}
.avatar{width:46px;height:46px;border-radius:14px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;
  font-weight:700;font-size:18px;flex:none}
.avatar.lg{width:60px;height:60px;font-size:21px;border-radius:17px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 12px 14px 14px;min-width:0;text-align:left}
.stat .i{color:var(--muted)}
.stat{transition:border-color .15s}
.stat:hover{border-color:var(--brand)}
.stat .k{display:block;color:var(--muted);font-size:14px;margin-top:12px}
.stat .v{display:block;font-size:22px;font-weight:700;color:var(--brand-text);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.duo .btn{padding:0 10px}

/* ---------- gift card art ---------- */
.cards-row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:2px 20px 6px;scrollbar-width:none}
.cards-row::-webkit-scrollbar{display:none}
.gcard{position:relative;flex:none;width:82%;max-width:330px;aspect-ratio:1.48;border-radius:22px;overflow:hidden;scroll-snap-align:start;
  background:linear-gradient(140deg,var(--c1),var(--c2));color:var(--ci,#fff);padding:18px 20px;display:flex;flex-direction:column;
  isolation:isolate;box-shadow:0 10px 24px -14px rgba(0,0,0,.55)}
.gcard.full{width:100%;max-width:none}
.gcard::before{content:"";position:absolute;inset:0;z-index:-1;
  background:radial-gradient(120% 80% at 100% 0%,rgba(255,255,255,.22),transparent 55%),
             repeating-linear-gradient(115deg,rgba(255,255,255,.045) 0 2px,transparent 2px 9px)}
.gcard .mono{color:var(--mono,inherit);position:absolute;right:-6px;bottom:-30px;font-size:170px;font-weight:850;line-height:1;opacity:.13;z-index:-1;letter-spacing:-.06em}
.gcard .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.gcard .brand{font-size:22px;font-weight:750;letter-spacing:-.01em;line-height:1.15}
.gcard .nick{font-size:13px;opacity:.75;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.pill{font-size:11.5px;font-weight:700;letter-spacing:.02em;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.2);
  backdrop-filter:blur(6px);white-space:nowrap}
.gcard.light .pill{background:rgba(0,0,0,.08)}
.gcard .bal{margin-top:auto}
.gcard .bal small{display:block;font-size:13px;opacity:.75}
.gcard .bal strong{font-size:30px;font-weight:750;letter-spacing:-.02em}
.gcard .foot{display:flex;justify-content:space-between;font-size:12.5px;opacity:.75;margin-top:2px}
.gcard.dim{filter:saturate(.25) brightness(.9)}

/* ---------- lists ---------- */
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left;min-height:62px}
.row+.row{border-top:1px solid var(--line)}
.ricon{width:36px;height:36px;border-radius:11px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--ink2)}
.rbody{flex:1;min-width:0}
.rt{font-weight:650;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ramt{font-weight:650;font-size:15.5px;white-space:nowrap;text-align:right}
.ramt small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.chev{color:var(--muted)}
.tile{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:16px;flex:none;
  background:linear-gradient(140deg,var(--c1),var(--c2));color:var(--ci,#fff)}
.off{display:inline-block;font-size:12px;font-weight:700;color:var(--brand-text);background:var(--brand-soft);
  padding:2px 7px;border-radius:7px;margin-top:3px}

/* ---------- chips / search / segmented ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:2px 20px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 15px;border-radius:99px;background:var(--chip);border:1px solid var(--line);font-size:14px;font-weight:600}
.chip.on{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:46px;margin-bottom:12px}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:16px}
.search .i{color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:color-mix(in srgb,var(--ink) 6%,transparent);border-radius:13px;padding:3px;gap:3px}
.seg>*{display:grid;place-items:center;height:38px;border-radius:10px;font-weight:650;font-size:14.5px;color:var(--muted)}
.seg>.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 10px;font-size:14px;color:var(--muted)}
.toolbar select{border:0;background:transparent;font-weight:650;color:var(--ink);font-size:14px;padding:4px 2px}

/* ---------- forms ---------- */
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:14px;color:var(--muted);margin:0 2px 6px}
.input{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px;outline:none}
.input:focus{border-color:var(--ink2)}
.input.bad{border-color:var(--danger)}
.err{color:var(--danger);font-size:13px;margin:6px 2px 0}
.hint{color:var(--muted);font-size:13px;margin:6px 2px 0}
.money-in{position:relative}
.money-in::before{content:"$";position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.money-in .input{padding-left:28px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pw{position:relative}
.pw .input{padding-right:48px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:8px;color:var(--muted);border-radius:10px}
.brand-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 8px;border-radius:14px;background:var(--surface);
  border:1.5px solid var(--line);font-size:12.5px;font-weight:600}
.bt .tile{width:34px;height:34px;font-size:14px;border-radius:10px}
.bt.on{border-color:var(--ink)}
.bt span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- card detail ---------- */
.progress{height:6px;border-radius:9px;background:color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden;margin:16px 2px 6px}
.progress i{display:block;height:100%;background:var(--brand);border-radius:9px}
.pmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:0 2px}
.secret{display:flex;align-items:center;gap:6px;padding:12px 14px}
.secret+.secret{border-top:1px solid var(--line)}
.secret .s-k{font-size:13px;color:var(--muted)}
.secret .s-v{font-weight:650;font-size:16px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.icon-btn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--ink2);border:1px solid var(--line);background:var(--surface2)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.notice{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);margin-top:14px}
.notice .i{color:var(--muted);margin-top:1px}

/* ---------- profile ---------- */
.p-head{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.p-head .rbody .rt{font-size:18px}
.savings{background:var(--brand-ink);color:#fff;position:relative;overflow:hidden;border-radius:20px;padding:18px 18px 16px;margin-top:12px}
:root[data-theme="dark"] .savings{background:#2A2A2F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .savings{background:#2A2A2F}}
.savings small{font-size:14px;opacity:.75}
.savings strong{display:block;color:var(--brand);font-size:34px;font-weight:750;margin:4px 0 6px;letter-spacing:-.02em}
.savings p{margin:0;font-size:13.5px;opacity:.7}
.kv{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;min-height:56px}
.kv+.kv{border-top:1px solid var(--line)}
.kv .k{flex:1;font-weight:600;font-size:15.5px}
.kv .v{color:var(--muted);font-size:14.5px;max-width:52%;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.switch{position:relative;width:50px;height:30px;border-radius:99px;background:color-mix(in srgb,var(--ink) 18%,transparent);flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch.on{background:var(--brand)}
.switch.on::after{transform:translateX(20px)}
.pref{display:flex;gap:12px;align-items:center;padding:13px 14px}
.pref+.pref{border-top:1px solid var(--line)}
.pref p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.foot-note{text-align:center;color:var(--muted);font-size:12.5px;margin-top:6px}
.p-foot{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:28px;color:var(--muted);font-size:13px}
.p-foot p{margin:0}
.brandbar{display:flex;justify-content:space-between;align-items:center;margin:-4px 0 18px}

/* ---------- empty ---------- */
.empty{text-align:center;padding:42px 18px;color:var(--muted)}
.empty .i{margin:0 auto 12px;color:var(--muted)}
.empty h3{color:var(--ink);margin:0 0 4px;font-size:17px}
.empty p{margin:0 0 16px;font-size:14.5px}

/* ---------- summary tiles ---------- */
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.mini div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.mini small{display:block;color:var(--muted);font-size:13px}
.mini b{font-size:19px}

/* ---------- sheet ---------- */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end}
.scrim.anim{animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 20px 26px}
.scrim.anim .sheet{animation:up .26s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40%);opacity:.4}}
.grab{width:38px;height:5px;border-radius:9px;background:color-mix(in srgb,var(--ink) 18%,transparent);margin:0 auto 12px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sheet-h h2{margin:0;font-size:22px;font-weight:720;letter-spacing:-.01em}
.sheet p.lead{color:var(--muted);margin:-6px 0 16px;font-size:14.5px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 14px;margin:12px 0 16px}
.sum div{display:flex;justify-content:space-between;padding:10px 0;font-size:15px}
.sum div+div{border-top:1px solid var(--line)}
.sum b{font-weight:700}

/* ---------- toasts ---------- */
#toasts{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:99;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(380px,calc(100% - 32px))}
.toast{background:var(--brand-ink);color:#fff;padding:12px 16px;border-radius:14px;font-size:14.5px;font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);
  animation:toastin .25s ease-out;display:flex;gap:8px;align-items:center;max-width:100%}
.toast::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--brand);flex:none}
:root[data-theme="dark"] .toast{background:#F4F5F7;color:#12141A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast{background:#F4F5F7;color:#12141A}}
.toast.out{opacity:0;transform:translateY(6px);transition:.25s}
@keyframes toastin{from{opacity:0;transform:translateY(10px)}}

/* ---------- auth ---------- */
.auth{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:24px 20px 40px}
.auth-in{width:100%;max-width:400px}
.auth-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px}
.auth h1{font-size:32px;font-weight:760;letter-spacing:-.025em;margin:0 0 6px;line-height:1.1}
.auth .lead{color:var(--muted);margin:0 0 26px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin:18px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.form-err{background:color-mix(in srgb,var(--danger) 10%,transparent);color:var(--danger);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.alt{text-align:center;margin-top:22px;color:var(--muted);font-size:15px}
.demo-note{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}

/* ---------- landing ---------- */
.home{min-height:100%;overflow-x:hidden}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.nav{display:flex;align-items:center;justify-content:space-between;height:76px;gap:12px}
.logo{display:inline-flex;align-items:center;gap:10px;color:var(--ink)}
.mark{display:block;flex:none}
.wordmark{font-family:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif;font-weight:700;font-size:24px;letter-spacing:-.015em;line-height:1}
.logo.sm{gap:8px}.logo.sm .wordmark{font-size:19px}
.logo.xs{gap:7px}.logo.xs .wordmark{font-size:16px}
.nav-r{display:flex;gap:8px;align-items:center}

async function hashPw(pw, salt) {
  try {
    if (window.crypto && crypto.subtle) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salt + "::" + pw));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }
  } catch (e) { }
  let h = 5381; for (const ch of salt + "::" + pw) h = ((h << 5) + h + ch.charCodeAt(0)) | 0;
  return "x" + (h >>> 0).toString(16);
}

  return { path: p || "/", parts: (p || "/").split("/").filter(Boolean), q: new URLSearchParams(q || "") };
}
function go(path) { if (location.hash === "#" + path) render(); else location.hash = path; }

function render() {
  const r = parseRoute();
  const a = acct();
  const root = $("#root");
  const ae = document.activeElement;
  const fid = ae && ae.id;
  let sel = null; try { if (ae && ae.selectionStart != null) sel = [ae.selectionStart, ae.selectionEnd]; } catch (e) { }
  const scr = $(".screen"), sh = $(".sheet");
  const st = scr ? scr.scrollTop : 0, sst = sh ? sh.scrollTop : 0;
  const keepX = {}; document.querySelectorAll("[data-keep-x]").forEach(el => keepX[el.dataset.keepX] = el.scrollLeft);
  const same = r.path === ui.lastPath;

  let html;
  if (r.parts[0] === "app") {
    if (!a) { ui.after = (location.hash || "").slice(1); location.replace("#/login"); return; }
    html = appShell(a, r, same);
  } else if (r.parts[0] === "login" || r.parts[0] === "signup") {
    if (a) { location.replace("#/app/wallet"); return; }
    html = vAuth(r.parts[0]);
  } else {
    html = vHome(a);
  }
  root.innerHTML = html;
  document.body.classList.toggle("in-app", r.parts[0] === "app");
  ui.lastPath = r.path; ui.sheetNew = false;

  if (same) {
    const s2 = $(".screen"); if (s2) s2.scrollTop = st;
    const sh2 = $(".sheet"); if (sh2 && sh) sh2.scrollTop = sst;
    document.querySelectorAll("[data-keep-x]").forEach(el => { if (keepX[el.dataset.keepX] != null) el.scrollLeft = keepX[el.dataset.keepX]; });
  }
  if (fid) {
    const el = document.getElementById(fid);
    if (el) { el.focus({ preventScroll: true }); if (sel) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) { } }
  } else if (ui.focusSheet) {
    const first = $(".sheet input, .sheet button.btn"); if (first) first.focus({ preventScroll: true });
  }
  ui.focusSheet = false;
  const titles = { wallet: "Wallet", cards: "All cards", card: "Card", add: "Add a card", market: "Marketplace", activity: "Activity", profile: "Profile" };
  document.title = r.parts[0] === "app" ? `${titles[r.parts[1] || "wallet"] || "Wallet"} – walletswap` : r.parts[0] === "login" ? "Log in – walletswap" : r.parts[0] === "signup" ? "Create account – walletswap" : "walletswap – buy, sell, and swap gift cards";
}

function appShell(a, r, same) {
  const s = r.parts[1] || "wallet";
  let body, tab = s;
  switch (s) {
    case "wallet": body = vWallet(a); break;
    case "cards": body = vCards(a); tab = "wallet"; break;
    case "card": body = vCard(a, r.parts[2]); tab = "wallet"; break;
    case "add": body = vAdd(a); tab = "add"; break;
    case "market": body = vMarket(a, r); break;
    case "activity": body = vActivity(a); break;
    case "profile": body = vProfile(a); break;
    default: body = vWallet(a); tab = "wallet";
  }
  return `<div class="stage"><div class="phone">
    <main class="screen${same ? "" : " anim"}" id="screen">${body}</main>
    ${tabbar(tab)}
    ${ui.sheet ? sheetHtml(a) : ""}
  </div></div>`;
}

function tabbar(t) {
  const T = (id, label, ic) => `<a class="tab${t === id ? " on" : ""}" href="#/app/${id}" ${t === id ? 'aria-current="page"' : ""}>${icon(ic, 25)}<span>${label}</span></a>`;
  return `<nav class="tabbar" aria-label="Main">
    ${T("wallet", "Wallet", "wallet")}${T("market", "Market", "store")}
    <a class="fab" href="#/app/add" aria-label="Add a gift card">${icon("plus", 26, 'stroke-width="2.2"')}</a>
    ${T("activity", "Activity", "pulse")}${T("profile", "Profile", "user")}
  </nav>`;
}

/* ================= shared pieces ================= */
function sortCards(cards) {
  const rank = c => c.status === "listed" ? 1 : c.balance > 0 ? 0 : 2;
  return cards.slice().sort((x, y) => rank(x) - rank(y) || y.addedAt - x.addedAt);
}
const cardState = c => c.status === "listed" ? "Listed" : c.balance <= 0 ? "Used up" : "Active";

function gArt(o) {
  const b = o.b, used = o.pill === "Used up";
  const tag = o.href ? "a" : "div";
  return `<${tag} class="gcard${o.full ? " full" : ""}${b.light ? " light" : ""}${used ? " dim" : ""}"${o.href ? ` href="${o.href}" aria-label="${esc(o.name)} card, ${o.hide ? "balance hidden" : "balance " + money(o.balance)}"` : ""} style="${cvars(b)}">
    <span class="mono" aria-hidden="true">${esc(initials(o.name).slice(0, 1))}</span>
    <div class="row1"><div style="min-width:0"><div class="brand">${esc(o.name)}</div>${o.nick ? `<div class="nick">${esc(o.nick)}</div>` : ""}</div><span class="pill">${o.pill}</span></div>
    <div class="bal"><small>Balance</small><strong class="num">${o.hide ? "$•••.••" : money(o.balance)}</strong></div>
    <div class="foot"><span>•••• ${esc(o.l4)}</span><span>${esc(o.type)}</span></div>
  </${tag}>`;
}
const gcard = (c, opts = {}) => gArt({ b: brandOf(c), name: brandName(c), nick: c.nickname, pill: cardState(c), balance: c.balance, l4: last4(c.number), type: c.type, hide: opts.hide, full: opts.full, href: opts.full ? "" : `#/app/card/${c.id}` });

const KIND = {

  purchased: { icon: "cart", label: "Purchased" }, sold: { icon: "dollar", label: "Sold" },
  listed: { icon: "tag", label: "Listed" }, unlisted: { icon: "undo", label: "Unlisted" },

const actBrand = x => x.brand === "other" ? (x.brandName || "Gift card") : ((BRANDS.find(b => b.id === x.brand) || {}).name || "Gift card");
function actRow(x, a) {

const empty = (ic, h, p, cta) => `<div class="empty">${icon(ic, 38)}<h3>${h}</h3><p>${p}</p>${cta || ""}</div>`;
const backBtn = (to, label = "Back") => `<a class="back" href="#${to}" aria-label="${label}">${icon("left", 20)}</a>`;
const fieldErr = k => ui.errs[k] ? `<p class="err" id="err-${k}">${esc(ui.errs[k])}</p>` : "";
const bad = k => ui.errs[k] ? " bad" : "";
const sw = (on, act, k, label) => `<button class="switch${on ? " on" : ""}" role="switch" aria-checked="${on}" aria-label="${esc(label)}" data-act="${act}" data-k="${k}"></button>`;

/* ================= marketplace ================= */

const AF = { all: null, added: ["added"], redeemed: ["redeemed", "edited"], purchases: ["purchased"], sales: ["sold", "withdraw"], listings: ["listed", "unlisted", "reprice", "removed"] };
function vActivity(a) {
  const d = a.data;

  const spent30 = -sum(d.activity.filter(x => x.kind === "redeemed" && x.t > Date.now() - 30 * DAY), x => x.amount);
  const groups = [];
  list.forEach(x => { const g = dayGroup(x.t); let last = groups[groups.length - 1]; if (!last || last.g !== g) groups.push(last = { g, items: [] }); last.items.push(x); });
  const labels = { all: "All", added: "Added", redeemed: "Redeemed", purchases: "Purchases", sales: "Sales", listings: "Listings" };
  return `
  <div class="top"><h1>Activity</h1></div>

function fin(id, model, label, o = {}) {

}
const FEE = 0.05;

        ${fin("pw-conf", "confirm", "Confirm new password", { attrs: 'type="password" autocomplete="new-password"' })}
        <button class="btn primary block" type="submit">Update password</button></form>`);
    case "pick": {
      const ok = sortCards(d.cards).filter(x => x.status !== "listed" && x.balance > 0);
      return sheetWrap("Choose a card to sell", ok.length ? `<div class="list">${ok.map(x => `<button class="row" data-act="pick-card" data-id="${x.id}">${tile(brandOf(x), brandName(x))}<span class="rbody"><span class="rt" style="display:block">${esc(brandName(x))}</span><span class="rs" style="display:block">${esc(x.nickname || "•••• " + last4(x.number))}</span></span><span class="ramt num">${money(x.balance)}</span>${icon("right", 18, 'class="chev"')}</button>`).join("")}</div>`
        : `<div class="list">${empty("card", "No cards to sell", "Only active cards with a balance can be listed.", `<a class="btn primary sm" href="#/app/add">Add a card</a>`)}</div>`);
    }
    case "theme": return sheetWrap("Appearance", `<div class="list">${[["system", "Match device"], ["light", "Light"], ["dark", "Dark"]].map(([v, l]) => `<button class="kv" data-act="theme" data-v="${v}" aria-pressed="${(S.theme || "system") === v}"><span class="k">${l}</span>${(S.theme || "system") === v ? icon("check", 20) : ""}</button>`).join("")}</div>`);
  }
  return "";
}

function openSheet(type, params = {}) {
  const a = acct(); if (!a) return;
  const d = a.data;
  const c = params.id ? d.cards.find(x => x.id === params.id) : null;
  ui.f = {}; ui.errs = {};
  if (type === "sell" && !d.payout.method) return openSheet("payout", { then: "sell", id: params.id });
  if (type === "withdraw" && !d.payout.method) return openSheet("payout", { then: "withdraw" });
  if (type === "edit" && c) ui.f = { nickname: c.nickname || "", balance: String(c.balance), type: c.type };
  if (type === "sell" && c) ui.f = { price: String(r2(Math.floor(c.balance * 0.9 * 4) / 4)) };
  if (type === "reprice" && c) ui.f = { price: String(c.listing.price) };
  if (type === "withdraw") ui.f = { amount: String(d.payout.balance) };
  if (type === "name") ui.f = { name: a.name };
  if (type === "email") ui.f = { email: a.email };
  ui.sheet = Object.assign({ type }, params);
  ui.sheetNew = true; ui.focusSheet = true;
  render();
}
function closeSheet() { ui.sheet = null; ui.f = {}; ui.errs = {}; render(); }
function afterSheet(s) { if (s && s.then) openSheet(s.then, { id: s.id }); else closeSheet(); }

/* ================= toasts ================= */
function toast(msg) {
  const box = $("#toasts"); if (!box) return;
  const el = document.createElement("div");
  el.className = "toast"; el.setAttribute("role", "status"); el.textContent = msg;
  box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 300); }, 2800);
}

/* ================= domain operations ================= */
function log(d, kind, card, amount, sub) {
  d.activity.unshift({ id: uid("a"), t: Date.now(), kind, brand: card ? card.brand : "", brandName: card ? card.brandName : "", cardId: card ? card.id : null, amount: r2(amount), sub });
  if (d.activity.length > 300) d.activity.length = 300;
}
function commit() { Store.save(); render(); }
function resetUi() { Object.assign(ui, { sheet: null, q: "", bf: "all", sort: "discount", af: "all", cf: "active", add: blankAdd(), f: {}, errs: {}, reveal: {}, authErr: "", showPw: false }); }
function signIn(a, msg) {
  S.session = a.email; Store.save();
  const to = ui.after && ui.after.startsWith("/app") ? ui.after : "/app/wallet";
  ui.after = null; resetUi();
  go(to); toast(msg); processSales();
}
function signOut(msg) { S.session = null; Store.save(); resetUi(); go("/"); toast(msg); }

function processSales() {
  const a = acct(); if (!a) return;
  const d = a.data, now = Date.now();
  const due = d.cards.filter(c => c.status === "listed" && c.listing && c.listing.sellAt <= now);
  if (!due.length) return;
  due.forEach(c => {
    const payout = r2(c.listing.price * (1 - FEE));
    d.cards = d.cards.filter(x => x.id !== c.id);
    d.payout.balance = r2(d.payout.balance + payout);
    log(d, "sold", c, payout, `Bought by ${pick(SELLERS)} for ${money(c.listing.price)}`);
    if (ui.sheet && ui.sheet.id === c.id) ui.sheet = null;
    if (d.prefs.saleAlerts) toast(`Your ${brandName(c)} card sold. ${money(payout)} added to your payout balance.`);
  });
  commit();
}

/* ================= actions ================= */
const ACTIONS = {
  close: () => closeSheet(),
  scrim: (ds, el, e) => { if (e.target === el) closeSheet(); },
  sheet: ds => openSheet(ds.s, { id: ds.id, then: ds.then }),
  "toggle-hide": () => { const d = acct().data; d.prefs.hide = !d.prefs.hide; commit(); },
  reveal: ds => { ui.reveal[ds.k] = !ui.reveal[ds.k]; render(); },
  copy: ds => {
    const c = acct().data.cards.find(x => x.id === ds.id); if (!c) return;
    const text = ds.k === "pin" ? c.pin : digits(c.number);
    const label = ds.k === "pin" ? "PIN copied" : "Card number copied";
    const fallback = () => { try { const t = document.createElement("textarea"); t.value = text; t.style.position = "fixed"; t.style.opacity = "0"; document.body.appendChild(t); t.select(); const ok = document.execCommand("copy"); t.remove(); toast(ok ? label : "Copy isn't available here. Tap the eye to show it instead."); } catch (e) { toast("Copy isn't available here. Tap the eye to show it instead."); } };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast(label), fallback); else fallback();
  },
  "add-brand": ds => { ui.add.brand = ds.v; delete ui.errs.brand; render(); },
  "add-type": ds => { ui.add.type = ds.v; render(); },
  "f-type": ds => { ui.f.type = ds.v; render(); },
  "cards-filter": ds => { ui.cf = ds.v; render(); },
  "brand-filter": ds => { ui.bf = ds.v; render(); },
  "act-filter": ds => { ui.af = ds.v; render(); },
  "clear-filters": () => { ui.q = ""; ui.bf = "all"; render(); },
  "market-refresh": () => { const d = acct().data; const fresh = seedMarket(4).map(l => Object.assign(l, { listedAt: Date.now() - rand(0, 4 * MIN) })); d.market = fresh.concat(d.market).slice(0, 40); ui.sort = "new"; commit(); toast("4 new listings added"); },
  quick: ds => { ui.f.amount = String(r2(ds.v)); delete ui.errs.amount; render(); },
  pref: ds => { const d = acct().data; d.prefs[ds.k] = !d.prefs[ds.k]; commit(); },
  theme: ds => { S.theme = ds.v; applyTheme(); Store.save(); render(); },
  "pick-card": ds => openSheet("sell", { id: ds.id }),
  "remove-payment": () => { const d = acct().data; const l = d.payment.label; d.payment = null; ui.sheet = null; commit(); toast(`${l} removed`); },
  "remove-payout": () => { const d = acct().data; const l = d.payout.method.label; d.payout.method = null; ui.sheet = null; commit(); toast(`${l} disconnected`); },
  buy: ds => {
    const d = acct().data;
    const l = d.market.find(x => x.id === ds.id);
    if (!l) { toast("This card was just sold to someone else."); closeSheet(); return; }
    if (!d.payment) return openSheet("payment", { then: "buy", id: ds.id });
    const card = { id: uid("c"), brand: l.brand, brandName: "", number: genNumber(), pin: genPin(), original: l.value, balance: l.value, type: l.type, nickname: "", source: "bought", paid: l.price, addedAt: Date.now(), status: "active", listing: null };
    d.market = d.market.filter(x => x.id !== l.id);
    d.cards.unshift(card);
    const saved = r2(l.value - l.price);
    d.saved = r2(d.saved + saved);
    log(d, "purchased", card, -l.price, "walletswap Marketplace");
    ui.sheet = null; Store.save();
    go(`/app/card/${card.id}`);
    toast(`${brandName(card)} card added. You saved ${money(saved)}.`);
  },
  confirm: ds => {
    const a = acct(), d = a.data, s = ui.sheet;
    const c = s && s.id ? d.cards.find(x => x.id === s.id) : null;
    if (ds.k === "unlist" && c) { c.status = "active"; log(d, "unlisted", c, 0, "Back in your wallet"); c.listing = null; ui.sheet = null; commit(); toast("Card removed from the marketplace"); }
    else if (ds.k === "remove" && c) { d.cards = d.cards.filter(x => x.id !== c.id); log(d, "removed", c, 0, "Deleted from wallet"); ui.sheet = null; Store.save(); go("/app/wallet"); toast(`${brandName(c)} card removed`); }
    else if (ds.k === "logout") signOut("Signed out");
    else if (ds.k === "reset") { a.data = a.demo ? seedDemoData() : freshData(); ui.sheet = null; ui.reveal = {}; commit(); toast(a.demo ? "Demo data reset" : "Wallet cleared"); }
    else if (ds.k === "delete") { delete S.accounts[a.email]; signOut("Account deleted"); }
  },
  "demo-login": () => { const a = S.accounts[DEMO.email]; if (a) signIn(a, `Welcome, ${firstName(a.name)}. This is the demo wallet.`); },
  "show-pw": () => { ui.showPw = !ui.showPw; render(); const el = $("#au-pw"); if (el) el.focus(); },
  scroll: ds => { const el = document.getElementById(ds.to); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }
};

/* ================= forms ================= */
function fail(e) { ui.errs = e; render(); const k = Object.keys(e)[0]; const el = document.querySelector(`[data-model$=".${k}"]`) || document.getElementById("err-" + k); if (el && el.focus) { el.focus(); if (el.scrollIntoView) el.scrollIntoView({ block: "center", behavior: "smooth" }); } }
const FORMS = {
  async login() {
    const f = ui.f, e = {};
    const email = String(f.email || "").trim().toLowerCase();
    if (!validEmail(email)) e.email = "Enter a valid email address.";
    if (!f.password) e.password = "Enter your password.";
    ui.authErr = "";
    if (Object.keys(e).length) return fail(e);
    const a = S.accounts[email];
    if (!a || (await hashPw(f.password, a.salt)) !== a.hash) { ui.errs = {}; ui.authErr = "That email and password don't match an account. Check them and try again."; return render(); }
    signIn(a, `Welcome back, ${firstName(a.name)}`);
  },
  async signup() {
    const f = ui.f, e = {};
    const name = String(f.name || "").trim(), email = String(f.email || "").trim().toLowerCase();
    if (name.length < 2) e.name = "Enter your name.";
    if (!validEmail(email)) e.email = "Enter a valid email address.";
    else if (S.accounts[email]) e.email = "An account with this email already exists. Log in instead.";
    if (String(f.password || "").length < 8) e.password = "Use at least 8 characters.";
    ui.authErr = "";
    if (Object.keys(e).length) return fail(e);
    const a = await makeAccount(name, email, f.password, false);
    S.accounts[email] = a;
    signIn(a, "Your wallet is ready. Add your first card.");
  },
  add() {
    const a = acct(), d = a.data, f = ui.add, e = {};
    if (!f.brand) e.brand = "Pick the store this card is for.";
    if (f.brand === "other" && !f.brandName.trim()) e.brandName = "Enter the store name.";
    const num = digits(f.number);
    if (num.length < 8 || num.length > 19) e.number = "Card numbers are 8–19 digits.";
    else if (d.cards.some(c => digits(c.number) === num && c.brand === f.brand)) e.number = "This card is already in your wallet.";
    if (f.pin && !/^\d{3,8}$/.test(f.pin)) e.pin = "PINs are 3–8 digits.";
    const orig = parseMoney(f.original);
    if (!(orig > 0)) e.original = "Enter the original value.";
    else if (orig > 2000) e.original = "Cards over $2,000 aren't supported.";
    const bal = f.balance === "" ? orig : parseMoney(f.balance);
    if (f.balance !== "" && !(bal >= 0)) e.balance = "Enter the current balance.";
    else if (orig > 0 && bal > orig) e.balance = "Can't be more than the original value.";
    if (f.expires) { const t = new Date(f.expires + "T23:59:59"); if (isNaN(t) || t < new Date()) e.expires = "This date has passed."; }
    if (Object.keys(e).length) return fail(e);
    const card = { id: uid("c"), brand: f.brand, brandName: f.brand === "other" ? f.brandName.trim() : "", number: num, pin: f.pin, expires: f.expires || "", original: orig, balance: r2(bal), type: f.type, nickname: f.nickname.trim(), source: "added", paid: null, addedAt: Date.now(), status: "active", listing: null };
    d.cards.unshift(card);
    log(d, "added", card, card.balance, "Added manually");
    ui.add = blankAdd(); ui.errs = {}; Store.save();
    go("/app/wallet");
    toast(`${brandName(card)} card added`);
  },
  spend() {
    const d = acct().data, c = d.cards.find(x => x.id === ui.sheet.id); if (!c) return closeSheet();
    const amt = parseMoney(ui.f.amount);
    if (!(amt > 0)) return fail({ amount: "Enter how much you spent." });
    if (amt > c.balance) return fail({ amount: `That's more than the ${money(c.balance)} left on this card.` });
    c.balance = r2(c.balance - amt);
    log(d, "redeemed", c, -amt, String(ui.f.where || "").trim() || `${brandName(c)} purchase`);
    ui.sheet = null; commit();
    toast(c.balance > 0 ? `Spent ${money(amt)}. ${money(c.balance)} left.` : `Spent ${money(amt)}. This card is used up.`);
  },
  edit() {
    const d = acct().data, c = d.cards.find(x => x.id === ui.sheet.id); if (!c) return closeSheet();
    const bal = parseMoney(ui.f.balance);
    if (!(bal >= 0)) return fail({ balance: "Enter the current balance." });
    if (bal > c.original) return fail({ balance: `Can't be more than the original ${money(c.original)}.` });
    if (bal !== c.balance) log(d, "edited", c, bal - c.balance, `Corrected from ${money(c.balance)}`);
    c.balance = bal; c.nickname = String(ui.f.nickname || "").trim(); c.type = ui.f.type || c.type;
    ui.sheet = null; commit(); toast("Changes saved");
  },
  sell() { return FORMS._price(true); },
  reprice() { return FORMS._price(false); },
  _price(isNew) {
    const d = acct().data, c = d.cards.find(x => x.id === ui.sheet.id); if (!c) return closeSheet();
    const p = parseMoney(ui.f.price);
    if (!(p > 0)) return fail({ price: "Enter an asking price." });
    if (p >= c.balance) return fail({ price: `Set a price below the ${money(c.balance)} balance so buyers save.` });
    if (p < c.balance * 0.5) return fail({ price: `The lowest price allowed is ${money(Math.ceil(c.balance * 50) / 100)}.` });
    if (isNew) {
      c.status = "listed";
      c.listing = { price: p, listedAt: Date.now(), sellAt: Date.now() + rand(25, 70) * 1000 };
      log(d, "listed", c, 0, `Asking ${money(p)}`);
    } else {
      log(d, "reprice", c, 0, `${money(c.listing.price)} to ${money(p)}`);
      c.listing.price = p;
    }
    ui.sheet = null; commit(); toast(isNew ? "Listed on the marketplace" : "Price updated");
  },
  payment() {
    const d = acct().data, f = ui.f, e = {};
    const num = digits(f.number);
    if (String(f.name || "").trim().length < 2) e.name = "Enter the name on the card.";
    if (num.length < 13 || num.length > 19) e.number = "Card numbers are 13–19 digits.";
    const m = /^(\d{2})\/(\d{2})$/.exec(f.exp || "");
    if (!m || +m[1] < 1 || +m[1] > 12) e.exp = "Use MM/YY.";
    else { const end = new Date(2000 + +m[2], +m[1], 0, 23, 59); if (end < new Date()) e.exp = "This card has expired."; }
    if (!/^\d{3,4}$/.test(f.cvc || "")) e.cvc = "3 or 4 digits.";
    if (Object.keys(e).length) return fail(e);
    const net = { 4: "Visa", 5: "Mastercard", 3: "Amex", 6: "Discover" }[num[0]] || "Card";
    d.payment = { label: `${net} •••• ${num.slice(-4)}` };
    const s = ui.sheet; Store.save(); toast(`${d.payment.label} saved`); afterSheet(s);
  },
  payout() {
    const d = acct().data, f = ui.f, e = {};
    if (String(f.holder || "").trim().length < 2) e.holder = "Enter the account holder's name.";
    if (!/^\d{9}$/.test(f.routing || "")) e.routing = "Routing numbers are 9 digits.";
    if (!/^\d{4,17}$/.test(f.account || "")) e.account = "Account numbers are 4–17 digits.";
    if (Object.keys(e).length) return fail(e);
    d.payout.method = { label: `Bank •••• ${f.account.slice(-4)}` };
    const s = ui.sheet; Store.save(); toast(`${d.payout.method.label} connected`); afterSheet(s);
  },
  withdraw() {
    const d = acct().data;
    const amt = parseMoney(ui.f.amount);
    if (!(amt > 0)) return fail({ amount: "Enter an amount." });
    if (amt > d.payout.balance) return fail({ amount: `You have ${money(d.payout.balance)} available.` });
    d.payout.balance = r2(d.payout.balance - amt);
    log(d, "withdraw", null, -amt, `To ${d.payout.method.label}`);
    ui.sheet = null; commit(); toast(`${money(amt)} is on its way to ${d.payout.method.label}`);
  },
  name() {
    const a = acct(), n = String(ui.f.name || "").trim();
    if (n.length < 2) return fail({ name: "Enter your name." });
    a.name = n; ui.sheet = null; commit(); toast("Name saved");
  },
  email() {
    const a = acct(), em = String(ui.f.email || "").trim().toLowerCase();
    if (a.demo) return fail({ email: "The demo account's email can't be changed." });
    if (!validEmail(em)) return fail({ email: "Enter a valid email address." });
    if (em !== a.email && S.accounts[em]) return fail({ email: "Another account already uses this email." });
    if (em !== a.email) { delete S.accounts[a.email]; a.email = em; S.accounts[em] = a; S.session = em; }
    ui.sheet = null; commit(); toast("Email saved");
  },
  async password() {
    const a = acct(), f = ui.f, e = {};
    if (!f.current || (await hashPw(f.current, a.salt)) !== a.hash) e.current = "That isn't your current password.";
    if (String(f.next || "").length < 8) e.next = "Use at least 8 characters.";
    else if (f.next !== f.confirm) e.confirm = "Passwords don't match.";
    if (Object.keys(e).length) return fail(e);
    a.salt = Math.random().toString(36).slice(2) + Date.now().toString(36);
    a.hash = await hashPw(f.next, a.salt);
    ui.sheet = null; commit(); toast("Password updated");
  }
};

/* ================= events ================= */
function setModel(path, v) {
  const [a, b] = path.split(".");
  if (b === undefined) ui[a] = v; else { ui[a] = ui[a] || {}; ui[a][b] = v; }
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  if (el.dataset.act !== "scrim") e.preventDefault();
  if (el.disabled) return;
  fn(el.dataset, el, e);
});
function onInput(e) {
  const el = e.target, m = el.dataset && el.dataset.model;
  if (!m) return;
  let v = el.value;
  const fmt = el.dataset.fmt;
  if (fmt === "card") v = groupNum(v);
  else if (fmt === "digits") v = digits(v).slice(0, +(el.dataset.max || 19));
  else if (fmt === "money") { v = v.replace(/[^0-9.]/g, ""); const i = v.indexOf("."); if (i >= 0) v = v.slice(0, i + 1) + v.slice(i + 1).replace(/\./g, "").slice(0, 2); v = v.slice(0, 9); }
  else if (fmt === "exp") { const g = digits(v).slice(0, 4); v = g.length > 2 ? g.slice(0, 2) + "/" + g.slice(2) : g; }
  if (fmt && el.value !== v) el.value = v;
  setModel(m, v);
  if (el.dataset.live) render();
}
document.addEventListener("input", onInput);
document.addEventListener("change", e => { if (e.target.tagName === "SELECT") onInput(e); });
document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-form]"); if (!f) return;
  e.preventDefault();
  const fn = FORMS[f.dataset.form]; if (fn) fn();
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && ui.sheet) closeSheet(); });
window.addEventListener("hashchange", () => {
  ui.sheet = null; ui.errs = {}; ui.authErr = "";
  const r = parseRoute();
  if (r.parts[0] !== "app") ui.f = {};
  render();
  window.scrollTo(0, 0);
});

function applyTheme() {
  const t = S && S.theme;
  if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
}

/* ================= boot ================= */
(async function boot() {
  await Store.init();
  applyTheme();
  render();
  setInterval(processSales, 4000);
  setInterval(() => { if (acct() && !ui.sheet && !document.hidden) { const r = parseRoute(); if (r.parts[1] === "activity" || r.parts[1] === "market" || (r.parts[1] || "wallet") === "wallet") render(); } }, 60000);
  window.__giftly = window.__walletswap = { get S() { return S; }, ui, Store };
})();
