project_id = "walletswap"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/auth/callback",
  "http://localhost:5173/auth/recovery",
  "walletswap://auth/callback",
  "walletswap://auth/recovery"
]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[functions.ruby-chat]
verify_jwt = true

[functions.wallet-actions]
verify_jwt = true

[functions.marketplace-actions]
verify_jwt = true

[functions.notification-worker]
verify_jwt = false

[functions.authorized-balance-webhook]
verify_jwt = false

[functions.account-delete]
verify_jwt = false
